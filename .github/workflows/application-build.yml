{
  "name": "Application build",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "core": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "${{ steps.toolchain.outputs.python }}"
          }
        },
        {
          "name": "Acquire declared project tools",
          "run": "python scripts/toolchain.py install --core-only"
        },
        {
          "name": "Build and test core with declared tools",
          "run": "build/tooling/bin/python scripts/toolchain.py build --preset core-release",
          "id": "build"
        },
        {
          "name": "Collect core raw CI evidence",
          "if": "always() && !cancelled()",
          "env": {
            "XDSTARTER_JOB_STATUS": "${{ job.status }}",
            "XDSTARTER_STEP_BUILD": "${{ steps.build.outcome }}"
          },
          "run": "python3 scripts/ci_evidence.py collect --role core"
        },
        {
          "name": "Upload core raw CI evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ci-core-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "build/ci-evidence/core/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "env": {
        "XDSTARTER_CI_EVIDENCE": "build/ci-evidence/core"
      }
    },
    "windows": {
      "runs-on": "windows-2022",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "timeout-minutes": "${{ github.event_name == 'pull_request' && 5 || 60 }}",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT\n\"uv=$($baseline.ciAcquisition.uvVersion)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up pinned Python acquisition tool",
          "uses": "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e",
          "with": {
            "version": "${{ steps.toolchain.outputs.uv }}",
            "enable-cache": false
          }
        },
        {
          "name": "Acquire declared Python",
          "id": "python",
          "shell": "pwsh",
          "run": "$pythonVersion = '${{ steps.toolchain.outputs.python }}'\nuv python install $pythonVersion\nif ($LASTEXITCODE -ne 0) { throw 'Declared Python acquisition failed.' }\n$pythonPath = (uv python find --managed-python $pythonVersion).Trim()\nif ($LASTEXITCODE -ne 0 -or !$pythonPath) { throw 'Cannot locate declared managed Python.' }\n\"path=$pythonPath\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Acquire declared tools and Qt, build, lint and test",
          "shell": "pwsh",
          "run": "./scripts/build-windows.ps1 -Toolchain MSVC2022 -InstallTools -Python $env:XDSTARTER_DECLARED_PYTHON -Fresh -Distribution -BuildNumber $env:GITHUB_RUN_NUMBER",
          "env": {
            "XDSTARTER_DECLARED_PYTHON": "${{ steps.python.outputs.path }}"
          },
          "id": "build"
        },
        {
          "name": "Inspect contrast frame trace integrity",
          "id": "contrast_trace",
          "shell": "pwsh",
          "run": "foreach ($mode in @('offscreen', 'native')) {\n  $expected = if ($mode -eq 'native') { @('--qpa', 'windows', '--graphics-api', '4') } else { @('--qpa', 'offscreen', '--graphics-api', '1') }\n  & ./build/tooling/Scripts/python.exe scripts/inspect_contrast_frame_trace.py \"build/app-release/high-contrast-frame-evidence/$mode\" @expected\n  if ($LASTEXITCODE -ne 0) { throw \"Incomplete contrast frame trace: $mode\" }\n}"
        },
        {
          "name": "Verify raw native picker evidence",
          "id": "picker_audit",
          "shell": "pwsh",
          "run": "& ./build/tooling/Scripts/python.exe scripts/verify_native_picker_evidence.py build/app-release/native-picker-evidence\nif ($LASTEXITCODE -ne 0) { throw 'Native picker evidence is incomplete or contains a severe Qt message.' }"
        },
        {
          "name": "Record smoke startup phases",
          "if": "always() && !cancelled()",
          "shell": "pwsh",
          "run": "$test = Join-Path $PWD 'build/app-release/bin/xdstarter.exe'\n$ctest = Join-Path $PWD 'build/tooling/Scripts/ctest.exe'\nif (!(Test-Path $test) -or !(Test-Path $ctest)) { Write-Host 'Smoke binary or CTest unavailable; phase comparison skipped.'; exit 0 }\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& $ctest --test-dir build/app-release -R '^app\\.qml_smoke$' --verbose --no-tests=error --output-log (Join-Path $env:XDSTARTER_CI_EVIDENCE 'smoke.log')\n$ctestExit = $LASTEXITCODE\n& ./build/tooling/Scripts/python.exe scripts/observe_smoke_startup.py --executable $test --output-dir build/validation/smoke-startup-ci --timeout-seconds 15\n$observerExit = $LASTEXITCODE\nif ($ctestExit -ne 0) { throw 'Smoke startup phase check failed.' }\nif ($observerExit -ne 0) { throw 'Independent smoke startup observation failed.' }",
          "id": "smoke"
        },
        {
          "name": "Compare failed Shell fixture in the user profile",
          "if": "failure() && !cancelled()",
          "shell": "pwsh",
          "run": "$test = Join-Path $PWD 'build/app-release/xdstarter_application_platform_tests.exe'\n$helper = Join-Path $PWD 'build/app-release/xdstarter_launch_fixture.exe'\nif (!(Test-Path $test) -or !(Test-Path $helper)) { Write-Host 'Shell fixture binaries unavailable; comparison skipped.'; exit 0 }\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$comparison = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) \"Temp/xdstarter-shell-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/build/fixture\"\nNew-Item -ItemType Directory -Path $comparison -Force | Out-Null\nPush-Location $comparison\ntry {\n  & $test $helper\n  $result = $LASTEXITCODE\n  Write-Host \"User-profile fixture comparison exit code: $result\"\n} finally { Pop-Location }\nexit 0"
        },
        {
          "name": "Repeat hosted Shell localization checks",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n$history = Join-Path $PWD 'build/app-release/shell-localization-history'\nNew-Item -ItemType Directory -Path $history -Force | Out-Null\nforeach ($name in @('workspace', 'profile')) { $source = Join-Path $PWD \"build/app-release/shell-localization-evidence/$name/catalog-errors.json\"; Copy-Item -LiteralPath $source -Destination (Join-Path $history \"$name-initial.json\"); Remove-Item -LiteralPath $source }\n& ./build/tooling/Scripts/ctest.exe --test-dir build/app-release -R '^platform\\.applications(\\.localized)?$' --output-on-failure --no-tests=error --output-log (Join-Path $env:XDSTARTER_CI_EVIDENCE 'shell.log')\n$result = $LASTEXITCODE\nforeach ($name in @('workspace', 'profile')) { $source = Join-Path $PWD \"build/app-release/shell-localization-evidence/$name/catalog-errors.json\"; if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination (Join-Path $history \"$name-repeat.json\") } elseif ($result -eq 0) { throw \"Missing repeated Shell evidence: $name\" } }\nif ($result -ne 0) { throw 'Repeated Shell localization check failed.' }",
          "id": "shell"
        },
        {
          "name": "Observe cross-location Shell resource matrix",
          "id": "shell_matrix",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$helper = Join-Path $PWD 'build/app-release/xdstarter_launch_fixture.exe'\n$output = Join-Path $PWD 'build/app-release/shell-localization-history/cross-matrix.json'\n& ./scripts/diagnose_shell_matrix.ps1 -Helper $helper -Output $output\n& ./build/tooling/Scripts/python.exe scripts/verify_shell_matrix.py $output --helper $helper\nif ($LASTEXITCODE -ne 0) { throw 'Shell cross-location evidence invalid.' }"
        },
        {
          "name": "Validate synthetic search benchmark evidence",
          "shell": "pwsh",
          "run": "$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& ./build/tooling/Scripts/python.exe scripts/benchmark_search.py --executable build/app-release/xdstarter_search_service_tests.exe --output build/app-release/search-benchmark-ci.json --entries 0 1000\nif ($LASTEXITCODE -ne 0) { throw 'Synthetic search benchmark evidence failed.' }",
          "id": "search"
        },
        {
          "name": "Validate synthetic UI search benchmark evidence",
          "shell": "pwsh",
          "run": "$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n$env:QT_FORCE_STDERR_LOGGING = '1'\n& ./build/tooling/Scripts/python.exe scripts/benchmark_ui_search.py --executable build/app-release/bin/xdstarter_ui_tests.exe --output build/app-release/ui-search-benchmark-ci.json --hosted-native\nif ($LASTEXITCODE -ne 0) { throw 'Synthetic UI search benchmark evidence failed.' }\n& ./build/tooling/Scripts/python.exe scripts/benchmark_ui_search.py --executable build/app-release/bin/xdstarter_ui_tests.exe --output build/app-release/ui-search-input-timing-ci.json --hosted-native --input-timing\nif ($LASTEXITCODE -ne 0) { throw 'Synthetic UI search input timing failed.' }",
          "id": "ui_search"
        },
        {
          "name": "Sample synthetic host reveal performance",
          "shell": "pwsh",
          "run": "$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& ./build/tooling/Scripts/python.exe scripts/benchmark_ui_reveal.py --executable build/app-release/bin/xdstarter_ui_tests.exe --output-dir build/validation/ui-reveal-ci --hosted-native\nif ($LASTEXITCODE -ne 0) { throw 'Synthetic host reveal benchmark evidence failed.' }",
          "id": "ui_reveal"
        },
        {
          "name": "Sample fresh synthetic host processes",
          "shell": "pwsh",
          "run": "$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& ./build/tooling/Scripts/python.exe scripts/benchmark_ui_reveal_fresh.py --executable build/app-release/bin/xdstarter_ui_tests.exe --output-dir build/validation/ui-reveal-fresh-ci --hosted-native\nif ($LASTEXITCODE -ne 0) { throw 'Fresh synthetic host reveal evidence failed.' }",
          "id": "ui_reveal_fresh"
        },
        {
          "name": "Sample empty-layout host reveals",
          "shell": "pwsh",
          "run": "$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& ./build/tooling/Scripts/python.exe scripts/benchmark_ui_reveal.py --executable build/app-release/bin/xdstarter_ui_tests.exe --output-dir build/validation/ui-reveal-empty-ci --hosted-native --empty-layout\nif ($LASTEXITCODE -ne 0) { throw 'Empty-layout host reveal evidence failed.' }",
          "id": "ui_reveal_empty"
        },
        {
          "name": "Exercise diagnostic snapshot reads on Windows",
          "shell": "pwsh",
          "run": "$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& ./build/tooling/Scripts/python.exe -m unittest discover -s tests/tooling -p test_verify_capture_diagnostics.py -v\nif ($LASTEXITCODE -ne 0) { throw 'Diagnostic snapshot reader regression failed.' }"
        },
        {
          "name": "Build and test isolated Windows experiments",
          "shell": "pwsh",
          "run": "$vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'\n$vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\nif ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Cannot locate the MSVC 2022 validation toolchain.' }\nImport-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')\nEnter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n$cmake = './build/tooling/Scripts/cmake.exe'\n& $cmake -S . -B build/app-release -DXDSTARTER_BUILD_START_BRIDGE_POC=ON -DXDSTARTER_BUILD_EXPLORER_ROUTE_PROBE=ON -DXDSTARTER_BUILD_PICKER_CANCEL_POC=ON\nif ($LASTEXITCODE) { throw 'Experiment configure failed.' }\n& $cmake --build build/app-release --parallel 3 --target xdstarter_start_bridge_poc xdstarter_start_bridge_fixture xdstarter_start_bridge_controller xdstarter_start_bridge_tests xdstarter_route_probe xdstarter_picker_cancel_poc xdstarter_picker_process_poc\nif ($LASTEXITCODE) { throw 'Experiment build failed.' }\n& ./build/tooling/Scripts/ctest.exe --test-dir build/app-release -R '^experimental\\.(start-bridge|explorer-route|picker-(cancel|process))' --verbose --no-tests=error --output-log (Join-Path $env:XDSTARTER_CI_EVIDENCE 'experiments.log')\nif ($LASTEXITCODE) { throw 'Experiment integration failed.' }\n& ./build/tooling/Scripts/python.exe scripts/verify_capture_diagnostics.py --executable build/app-release/bin/xdstarter.exe --output build/validation/capture-diagnostics-ci\nif ($LASTEXITCODE) { throw 'Diagnostic I/O recovery failed.' }\n& ./build/tooling/Scripts/python.exe scripts/verify_capture_diagnostics.py --executable build/app-release/bin/xdstarter.exe --mode area-cache --output build/validation/area-diagnostics-ci\nif ($LASTEXITCODE) { throw 'Area diagnostic I/O recovery failed.' }",
          "id": "experiments"
        },
        {
          "name": "Sample bounded hosted resident resources",
          "id": "resident_sample",
          "shell": "pwsh",
          "run": "$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n& ./build/tooling/Scripts/python.exe scripts/benchmark_resident.py --executable build/app-release/bin/xdstarter.exe --output build/validation/resident-sample-ci\nif ($LASTEXITCODE -ne 0) { throw 'Bounded resident sample failed.' }\n& ./build/tooling/Scripts/python.exe scripts/inspect_resident_sample.py build/validation/resident-sample-ci --expected-sha $env:GITHUB_SHA\nif ($LASTEXITCODE -ne 0) { throw 'Resident sample evidence is incomplete.' }"
        },
        {
          "name": "Identify fixed Windows packaging inputs",
          "id": "package-inputs",
          "shell": "pwsh",
          "run": "./build/tooling/Scripts/python.exe scripts/ci_package_inputs.py plan"
        },
        {
          "name": "Restore fixed Windows packaging inputs",
          "id": "package-cache",
          "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "key": "${{ steps.package-inputs.outputs.key }}",
            "path": "${{ steps.package-inputs.outputs.paths }}"
          }
        },
        {
          "name": "Verify restored input sources and bytes",
          "if": "steps.package-cache.outputs.cache-matched-key != ''",
          "shell": "pwsh",
          "env": {
            "XDSTARTER_MATCHED_KEY": "${{ steps.package-cache.outputs.cache-matched-key }}"
          },
          "run": "./build/tooling/Scripts/python.exe scripts/ci_package_inputs.py verify --restored --matched-key $env:XDSTARTER_MATCHED_KEY"
        },
        {
          "name": "Prepare locked Windows packaging inputs",
          "shell": "pwsh",
          "run": "./scripts/build-windows.ps1 -Toolchain MSVC2022 -Stage prepare-package",
          "id": "prepare"
        },
        {
          "name": "Verify all prepared supplier inputs",
          "shell": "pwsh",
          "run": "./build/tooling/Scripts/python.exe scripts/ci_package_inputs.py verify"
        },
        {
          "name": "Save verified supplier inputs from main",
          "if": "github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package-cache.outputs.cache-hit != 'true'",
          "uses": "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "key": "${{ steps.package-inputs.outputs.key }}",
            "path": "${{ steps.package-inputs.outputs.paths }}"
          }
        },
        {
          "name": "Deploy, prune, verify and package the Windows candidate",
          "shell": "pwsh",
          "run": "./scripts/build-windows.ps1 -Toolchain MSVC2022 -Stage package\nif ($LASTEXITCODE) { throw \"Windows candidate packaging failed\" }\n./build/tooling/Scripts/python.exe scripts/verify_windows_installer.py --output-dir build/package\nif ($LASTEXITCODE) { throw \"Isolated installer lifecycle failed\" }",
          "id": "package"
        },
        {
          "name": "Upload hosted search benchmark evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-search-benchmark-${{ github.sha }}",
            "path": "build/app-release/search-benchmark-ci.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted UI search benchmark evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ui-search-benchmark-${{ github.sha }}",
            "path": "build/app-release/ui-search-benchmark-ci.json\nbuild/app-release/ui-search-input-timing-ci.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted Shell localization evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-shell-localization-${{ github.sha }}",
            "path": "build/app-release/shell-localization-evidence/**/*.json\nbuild/app-release/shell-localization-history/*.json\nbuild/app-release/xdstarter_launch_fixture.exe",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload Windows candidate and bounded evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-windows-${{ github.sha }}",
            "path": "build/package/*.zip\nbuild/package/*-setup.exe\nbuild/package/*.tar.gz\nbuild/package/*.tar.xz\nbuild/package/*.json\nbuild/package/SHA256SUMS\nbuild/package/verification-*/*.log\nbuild/package/verification-*/*.json\nbuild/package/lifecycle-evidence/*.log\nbuild/package/lifecycle-evidence/*.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted graphics failure evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-graphics-failure-${{ github.sha }}",
            "path": "build/app-release/graphics-failure-evidence/*.log\nbuild/app-release/graphics-failure-evidence/*.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted layout import evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-layout-import-${{ github.sha }}",
            "path": "build/app-release/layout-import-native-evidence/*.log",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload native picker diagnostic evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-native-picker-${{ github.sha }}",
            "path": "build/app-release/native-picker-evidence/*.log",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted high contrast evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-high-contrast-${{ github.sha }}",
            "path": "build/app-release/high-contrast-native-evidence/*.log\nbuild/app-release/high-contrast-native-evidence/*.png",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload fresh host reveal evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ui-reveal-fresh-${{ github.sha }}",
            "path": "build/validation/ui-reveal-fresh-ci/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted host reveal evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ui-reveal-${{ github.sha }}",
            "path": "build/validation/ui-reveal-ci/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload empty-layout host reveal evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ui-reveal-empty-${{ github.sha }}",
            "path": "build/validation/ui-reveal-empty-ci/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted resident sample",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-resident-sample-${{ github.sha }}",
            "path": "build/validation/resident-sample-ci/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload contrast frame trace evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-contrast-frame-trace-${{ github.sha }}",
            "path": "build/app-release/high-contrast-frame-evidence/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Collect Windows raw CI evidence",
          "if": "always() && !cancelled()",
          "shell": "pwsh",
          "env": {
            "XDSTARTER_JOB_STATUS": "${{ job.status }}",
            "XDSTARTER_STEP_BUILD": "${{ steps.build.outcome }}",
            "XDSTARTER_STEP_PICKER_AUDIT": "${{ steps.picker_audit.outcome }}",
            "XDSTARTER_STEP_CONTRAST_TRACE": "${{ steps.contrast_trace.outcome }}",
            "XDSTARTER_STEP_SMOKE": "${{ steps.smoke.outcome }}",
            "XDSTARTER_STEP_SHELL": "${{ steps.shell.outcome }}",
            "XDSTARTER_STEP_SHELL_MATRIX": "${{ steps.shell_matrix.outcome }}",
            "XDSTARTER_STEP_SEARCH": "${{ steps.search.outcome }}",
            "XDSTARTER_STEP_UI_SEARCH": "${{ steps.ui_search.outcome }}",
            "XDSTARTER_STEP_UI_REVEAL": "${{ steps.ui_reveal.outcome }}",
            "XDSTARTER_STEP_UI_REVEAL_FRESH": "${{ steps.ui_reveal_fresh.outcome }}",
            "XDSTARTER_STEP_UI_REVEAL_EMPTY": "${{ steps.ui_reveal_empty.outcome }}",
            "XDSTARTER_STEP_EXPERIMENTS": "${{ steps.experiments.outcome }}",
            "XDSTARTER_STEP_RESIDENT_SAMPLE": "${{ steps.resident_sample.outcome }}",
            "XDSTARTER_STEP_PREPARE": "${{ steps.prepare.outcome }}",
            "XDSTARTER_STEP_PACKAGE": "${{ steps.package.outcome }}"
          },
          "run": "$python = './build/tooling/Scripts/python.exe'\nif (!(Test-Path -LiteralPath $python)) { $python = 'python' }\n& $python scripts/ci_evidence.py collect --role windows\nif ($LASTEXITCODE -ne 0) { throw 'Could not collect raw Windows CI evidence.' }"
        },
        {
          "name": "Upload Windows raw CI evidence",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ci-windows-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "build/ci-evidence/windows/",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ],
      "name": "Windows MSVC 2022 candidate (local v142 baseline unchanged)",
      "env": {
        "XDSTARTER_CI_EVIDENCE": "build/ci-evidence/windows"
      }
    },
    "plan": {
      "name": "CI shadow classification",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "outputs": {
        "classification": "${{ steps.plan.outputs.classification }}",
        "would_skip": "${{ steps.plan.outputs.would_skip }}"
      },
      "steps": [
        {
          "name": "Checkout complete history",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false
          }
        },
        {
          "name": "Classify without skipping checks",
          "id": "plan",
          "run": "python3 scripts/ci_classify.py"
        },
        {
          "name": "Upload shadow classification",
          "if": "always() && !cancelled()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-ci-plan-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "build/ci-evidence/plan.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    },
    "shadow-gate": {
      "name": "CI full evidence gate (shadow)",
      "needs": [
        "plan",
        "core",
        "windows"
      ],
      "if": "always() && !cancelled()",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Download core raw evidence",
          "continue-on-error": true,
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "xdstarter-ci-core-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "build/ci-gate/core"
          }
        },
        {
          "name": "Download windows raw evidence",
          "continue-on-error": true,
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "xdstarter-ci-windows-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "build/ci-gate/windows"
          }
        },
        {
          "name": "Validate all platform evidence",
          "env": {
            "XDSTARTER_NEEDS_CORE": "${{ needs.core.result }}",
            "XDSTARTER_NEEDS_WINDOWS": "${{ needs.windows.result }}",
            "XDSTARTER_PLAN_RESULT": "${{ needs.plan.result }}",
            "XDSTARTER_PLAN_CLASSIFICATION": "${{ needs.plan.outputs.classification }}",
            "XDSTARTER_PLAN_WOULD_SKIP": "${{ needs.plan.outputs.would_skip }}"
          },
          "run": "python3 scripts/ci_evidence.py validate"
        }
      ]
    }
  }
}
