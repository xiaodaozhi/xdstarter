{
  "name": "Application build",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "core": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "${{ steps.toolchain.outputs.python }}"
          }
        },
        {
          "name": "Acquire declared project tools",
          "run": "python scripts/toolchain.py install --core-only"
        },
        {
          "name": "Build and test core with declared tools",
          "run": "build/tooling/bin/python scripts/toolchain.py build --preset core-release"
        }
      ]
    },
    "windows": {
      "runs-on": "windows-2022",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT\n\"uv=$($baseline.ciAcquisition.uvVersion)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up pinned Python acquisition tool",
          "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884",
          "with": {
            "version": "${{ steps.toolchain.outputs.uv }}",
            "enable-cache": false
          }
        },
        {
          "name": "Acquire declared tools and Qt, build, lint and test",
          "shell": "pwsh",
          "run": "$pythonVersion = '${{ steps.toolchain.outputs.python }}'\nuv python install $pythonVersion\nif ($LASTEXITCODE -ne 0) { throw 'Declared Python acquisition failed.' }\n$pythonPath = (uv python find --managed-python $pythonVersion).Trim()\nif ($LASTEXITCODE -ne 0 -or !$pythonPath) { throw 'Cannot locate declared managed Python.' }\n./scripts/build-windows.ps1 -Toolchain MSVC2022 -InstallTools -Python $pythonPath -Fresh"
        },
        {
          "name": "Build and test isolated bridge, route and diagnostic I/O experiments",
          "shell": "pwsh",
          "run": "$vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'\n$vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\nif ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Cannot locate the MSVC 2022 validation toolchain.' }\nImport-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')\nEnter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n$cmake = './build/tooling/Scripts/cmake.exe'\n& $cmake -S . -B build/app-release -DXDSTARTER_BUILD_START_BRIDGE_POC=ON -DXDSTARTER_BUILD_EXPLORER_ROUTE_PROBE=ON\nif ($LASTEXITCODE) { throw 'Bridge configure failed.' }\n& $cmake --build build/app-release --parallel 3 --target xdstarter_start_bridge_poc xdstarter_start_bridge_fixture xdstarter_start_bridge_controller xdstarter_start_bridge_tests xdstarter_route_probe\nif ($LASTEXITCODE) { throw 'Bridge build failed.' }\n& ./build/tooling/Scripts/ctest.exe --test-dir build/app-release -R '^experimental\\.(start-bridge|explorer-route)' --output-on-failure --no-tests=error\nif ($LASTEXITCODE) { throw 'Bridge integration failed.' }\n& ./build/tooling/Scripts/python.exe scripts/verify_capture_diagnostics.py --executable build/app-release/bin/xdstarter.exe --output build/validation/capture-diagnostics-ci\nif ($LASTEXITCODE) { throw 'Diagnostic I/O recovery failed.' }"
        }
      ],
      "name": "Additional MSVC 2022 compatibility (not the v142 baseline)"
    }
  }
}
