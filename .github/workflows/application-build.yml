{
  "name": "Issue 56 disposable Shell trace experiment",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "trace": {
      "runs-on": "windows-2022",
      "timeout-minutes": 12,
      "steps": [
        {
          "name": "Checkout experiment",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Acquire pinned Microsoft diagnostic tool",
          "shell": "pwsh",
          "run": "New-Item -ItemType Directory -Force build/trace-tool | Out-Null\n$zip = Join-Path $PWD 'build/trace-tool/ProcessMonitor.zip'\nInvoke-WebRequest -UseBasicParsing -TimeoutSec 90 'https://download.sysinternals.com/files/ProcessMonitor.zip' -OutFile $zip\nif ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne '477754BF299C9E5B311C5666F7A4A48DFDB21265EAA8F0CCA70EF9D9552E3A10') { throw 'Microsoft tool archive hash mismatch.' }\nExpand-Archive -LiteralPath $zip -DestinationPath build/trace-tool/unpacked\n$exe = Join-Path $PWD 'build/trace-tool/unpacked/Procmon64.exe'\n$signature = Get-AuthenticodeSignature -LiteralPath $exe\nif ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne 'AB172913A2960A224809EE8A0C371CD47A079B72' -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -ne '28495E642B2A465474A4EDC58380EAF8B7EE580F3FBCB4141061DEADAFE9B885') { throw 'Microsoft tool binary signature or hash mismatch.' }"
        },
        {
          "name": "Trace owned Shell probes",
          "shell": "pwsh",
          "run": "& ./scripts/experimental_issue56_trace.ps1 -Procmon (Join-Path $PWD 'build/trace-tool/unpacked/Procmon64.exe')\nif (!$?) { throw 'The disposable Shell trace failed.' }"
        },
        {
          "name": "Upload only owned-process observations",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "issue56-shell-trace-${{ github.run_id }}",
            "path": "build/issue56-trace-artifact/",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
