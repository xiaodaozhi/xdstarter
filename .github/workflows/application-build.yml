{
  "name": "Application build",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "core": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "${{ steps.toolchain.outputs.python }}"
          }
        },
        {
          "name": "Acquire declared project tools",
          "run": "python scripts/toolchain.py install --core-only"
        },
        {
          "name": "Build and test core with declared tools",
          "run": "build/tooling/bin/python scripts/toolchain.py build --preset core-release"
        }
      ]
    },
    "windows": {
      "runs-on": "windows-2022",
      "timeout-minutes": 30,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "${{ steps.toolchain.outputs.python }}"
          }
        },
        {
          "name": "Acquire declared tools and Qt, build, lint and test",
          "shell": "pwsh",
          "run": "./scripts/build-windows.ps1 -Toolchain MSVC2022 -InstallTools -Python (Get-Command python).Source -Fresh"
        }
      ],
      "name": "Additional MSVC 2022 compatibility (not the v142 baseline)"
    }
  }
}
