{
  "name": "Application build",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "core": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "${{ steps.toolchain.outputs.python }}"
          }
        },
        {
          "name": "Acquire declared project tools",
          "run": "python scripts/toolchain.py install --core-only"
        },
        {
          "name": "Build and test core with declared tools",
          "run": "build/tooling/bin/python scripts/toolchain.py build --preset core-release"
        }
      ]
    },
    "windows": {
      "runs-on": "windows-2022",
      "timeout-minutes": 60,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Read declared Python baseline",
          "id": "toolchain",
          "shell": "pwsh",
          "run": "$baseline = Get-Content toolchain.json -Raw | ConvertFrom-Json\n\"python=$($baseline.python.version)\" >> $env:GITHUB_OUTPUT\n\"uv=$($baseline.ciAcquisition.uvVersion)\" >> $env:GITHUB_OUTPUT"
        },
        {
          "name": "Set up pinned Python acquisition tool",
          "uses": "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884",
          "with": {
            "version": "${{ steps.toolchain.outputs.uv }}",
            "enable-cache": false
          }
        },
        {
          "name": "Acquire declared tools and Qt, build, lint and test",
          "shell": "pwsh",
          "run": "$pythonVersion = '${{ steps.toolchain.outputs.python }}'\nuv python install $pythonVersion\nif ($LASTEXITCODE -ne 0) { throw 'Declared Python acquisition failed.' }\n$pythonPath = (uv python find --managed-python $pythonVersion).Trim()\nif ($LASTEXITCODE -ne 0 -or !$pythonPath) { throw 'Cannot locate declared managed Python.' }\n./scripts/build-windows.ps1 -Toolchain MSVC2022 -InstallTools -Python $pythonPath -Fresh -Distribution -BuildNumber $env:GITHUB_RUN_NUMBER"
        },
        {
          "name": "Compare failed Shell fixture in the user profile",
          "if": "failure()",
          "shell": "pwsh",
          "run": "$test = Join-Path $PWD 'build/app-release/xdstarter_application_platform_tests.exe'\n$helper = Join-Path $PWD 'build/app-release/xdstarter_launch_fixture.exe'\nif (!(Test-Path $test) -or !(Test-Path $helper)) { Write-Host 'Shell fixture binaries unavailable; comparison skipped.'; exit 0 }\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$comparison = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) \"Temp/xdstarter-shell-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/build/fixture\"\nNew-Item -ItemType Directory -Path $comparison -Force | Out-Null\nPush-Location $comparison\ntry {\n  & $test $helper\n  $result = $LASTEXITCODE\n  Write-Host \"User-profile fixture comparison exit code: $result\"\n} finally { Pop-Location }\nexit 0"
        },
        {
          "name": "Build and test isolated bridge, route and diagnostic I/O experiments",
          "shell": "pwsh",
          "run": "$vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'\n$vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\nif ($LASTEXITCODE -ne 0 -or !$vs) { throw 'Cannot locate the MSVC 2022 validation toolchain.' }\nImport-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')\nEnter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'\n$env:PATH = (Join-Path $PWD 'build/Qt/6.8.2/msvc2022_64/bin') + [IO.Path]::PathSeparator + $env:PATH\n$env:TEMP = Join-Path $PWD 'build/tmp'\n$env:TMP = $env:TEMP\n$cmake = './build/tooling/Scripts/cmake.exe'\n& $cmake -S . -B build/app-release -DXDSTARTER_BUILD_START_BRIDGE_POC=ON -DXDSTARTER_BUILD_EXPLORER_ROUTE_PROBE=ON\nif ($LASTEXITCODE) { throw 'Bridge configure failed.' }\n& $cmake --build build/app-release --parallel 3 --target xdstarter_start_bridge_poc xdstarter_start_bridge_fixture xdstarter_start_bridge_controller xdstarter_start_bridge_tests xdstarter_route_probe\nif ($LASTEXITCODE) { throw 'Bridge build failed.' }\n& ./build/tooling/Scripts/ctest.exe --test-dir build/app-release -R '^experimental\\.(start-bridge|explorer-route)' --output-on-failure --no-tests=error\nif ($LASTEXITCODE) { throw 'Bridge integration failed.' }\n& ./build/tooling/Scripts/python.exe scripts/verify_capture_diagnostics.py --executable build/app-release/bin/xdstarter.exe --output build/validation/capture-diagnostics-ci\nif ($LASTEXITCODE) { throw 'Diagnostic I/O recovery failed.' }\n& ./build/tooling/Scripts/python.exe scripts/verify_capture_diagnostics.py --executable build/app-release/bin/xdstarter.exe --mode area-cache --output build/validation/area-diagnostics-ci\nif ($LASTEXITCODE) { throw 'Area diagnostic I/O recovery failed.' }"
        },
        {
          "name": "Prepare locked Windows packaging inputs",
          "shell": "pwsh",
          "run": "./scripts/build-windows.ps1 -Toolchain MSVC2022 -Stage prepare-package"
        },
        {
          "name": "Deploy, prune, verify and package the Windows candidate",
          "shell": "pwsh",
          "run": "./scripts/build-windows.ps1 -Toolchain MSVC2022 -Stage package\nif ($LASTEXITCODE) { throw \"Windows candidate packaging failed\" }\n./build/tooling/Scripts/python.exe scripts/verify_windows_installer.py --output-dir build/package\nif ($LASTEXITCODE) { throw \"Isolated installer lifecycle failed\" }"
        },
        {
          "name": "Upload hosted Shell localization evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-shell-localization-${{ github.sha }}",
            "path": "build/app-release/shell-localization-evidence/**/*.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload Windows candidate and bounded evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-windows-${{ github.sha }}",
            "path": "build/package/*.zip\nbuild/package/*-setup.exe\nbuild/package/*.tar.gz\nbuild/package/*.tar.xz\nbuild/package/*.json\nbuild/package/SHA256SUMS\nbuild/package/verification-*/*.log\nbuild/package/verification-*/*.json\nbuild/package/lifecycle-evidence/*.log\nbuild/package/lifecycle-evidence/*.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        },
        {
          "name": "Upload hosted graphics failure evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "xdstarter-graphics-failure-${{ github.sha }}",
            "path": "build/app-release/graphics-failure-evidence/*.log\nbuild/app-release/graphics-failure-evidence/*.json",
            "if-no-files-found": "warn",
            "retention-days": 7
          }
        }
      ],
      "name": "Windows MSVC 2022 candidate (local v142 baseline unchanged)"
    }
  }
}
