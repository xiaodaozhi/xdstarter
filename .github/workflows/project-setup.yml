{
  "name": "Project setup",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/project-bootstrap.json",
        "scripts/github/bootstrap.py",
        ".github/workflows/project-setup.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "issues": "write"
  },
  "concurrency": {
    "group": "project-bootstrap",
    "cancel-in-progress": false
  },
  "jobs": {
    "setup": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout (actions/checkout v6)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Ensure labels, milestones and initial Issues",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 scripts/github/bootstrap.py --apply"
        }
      ]
    }
  }
}
