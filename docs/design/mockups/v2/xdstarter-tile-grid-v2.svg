<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#F3F5F8" stroke="none" /><text x="72" y="76" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="34" font-weight="600" >XDStarter / 磁贴尺寸与对齐</text><text x="72" y="116" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="400" >统一使用 48 DIP 小格与 8 DIP 间隙，所有尺寸由跨格数推导。</text><text x="1528" y="76" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="14" font-weight="500" text-anchor="end" letter-spacing="2">GRID SYSTEM / 02</text><rect x="72" y="164" width="464" height="346" rx="22" fill="#FFFFFF" stroke="none" /><text x="100" y="210" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="24" font-weight="600" >小正方形</text><rect x="268.0" y="292.0" width="72.0" height="72.0" rx="6" fill="#36D6CB" stroke="none" /><text x="304" y="460" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="400" text-anchor="middle">48 × 48 DIP / 1 × 1 格</text><rect x="568" y="164" width="464" height="346" rx="22" fill="#FFFFFF" stroke="none" /><text x="596" y="210" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="24" font-weight="600" >标准正方形</text><rect x="722.0" y="250.0" width="156.0" height="156.0" rx="6" fill="#368BFF" stroke="none" /><text x="800" y="460" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="400" text-anchor="middle">104 × 104 DIP / 2 × 2 格</text><rect x="1064" y="164" width="464" height="346" rx="22" fill="#FFFFFF" stroke="none" /><text x="1092" y="210" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="24" font-weight="600" >宽磁贴</text><rect x="1134.0" y="250.0" width="324.0" height="156.0" rx="6" fill="#225FB8" stroke="none" /><text x="1296" y="460" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="400" text-anchor="middle">216 × 104 DIP / 4 × 2 格</text><rect x="72" y="534" width="712" height="364" rx="22" fill="#FFFFFF" stroke="none" /><text x="100" y="578" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="22" font-weight="600" >两枚标准磁贴 + 间隙 = 一枚宽磁贴</text><rect x="120" y="626" width="104" height="104" rx="6" fill="#368BFF" stroke="none" /><text x="172.0" y="685.0" fill="#FFFFFF" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="600" text-anchor="middle">104</text><rect x="232" y="626" width="104" height="104" rx="6" fill="#368BFF" stroke="none" /><text x="284.0" y="685.0" fill="#FFFFFF" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="600" text-anchor="middle">104</text><rect x="120" y="746" width="216" height="104" rx="6" fill="#225FB8" stroke="none" /><text x="228.0" y="805.0" fill="#FFFFFF" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="600" text-anchor="middle">216</text><path d="M120 610L120 860" stroke="#36D6CB" stroke-width="1" stroke-dasharray="4 4"/><path d="M336 610L336 860" stroke="#36D6CB" stroke-width="1" stroke-dasharray="4 4"/><text x="396" y="672" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="22" font-weight="600" >104 + 8 + 104 = 216</text><text x="396" y="710" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="18" font-weight="400" >左右边缘与磁贴高度保持对齐</text><text x="396" y="798" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="18" font-weight="400" >宽磁贴比例包含中缝：</text><text x="396" y="834" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="22" font-weight="600" >216 : 104 ≈ 2.077 : 1</text><rect x="808" y="534" width="720" height="364" rx="22" fill="#FFFFFF" stroke="none" /><text x="836" y="578" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="22" font-weight="600" >四枚小磁贴 = 一枚标准磁贴的占位</text><rect x="864" y="654" width="48" height="48" rx="6" fill="#36D6CB" stroke="none" /><rect x="864" y="710" width="48" height="48" rx="6" fill="#36D6CB" stroke="none" /><rect x="920" y="654" width="48" height="48" rx="6" fill="#36D6CB" stroke="none" /><rect x="920" y="710" width="48" height="48" rx="6" fill="#36D6CB" stroke="none" /><rect x="1096" y="654" width="104" height="104" rx="6" fill="#368BFF" stroke="none" /><text x="1148.0" y="713.0" fill="#FFFFFF" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="20" font-weight="600" text-anchor="middle">104</text><text x="1032" y="716" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="28" font-weight="500" >=</text><path d="M844 654L1220 654" stroke="#36D6CB" stroke-width="1" stroke-dasharray="4 4"/><path d="M844 758L1220 758" stroke="#36D6CB" stroke-width="1" stroke-dasharray="4 4"/><text x="1260" y="696" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="21" font-weight="600" >48 + 8 + 48</text><text x="1260" y="730" fill="#142138" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="21" font-weight="600" >= 104</text><text x="844" y="820" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="18" font-weight="400" >“半宽”指半格占位；小磁贴实体边长为 (104 − 8) ÷ 2。</text><text x="844" y="856" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="18" font-weight="400" >小磁贴显示居中图标，悬停或键盘聚焦时显示名称。</text><rect x="72" y="922" width="1456" height="92" rx="18" fill="#142138" stroke="none" /><text x="104" y="960" fill="#AABBD3" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="18" font-weight="600" >统一计算</text><text x="236" y="960" fill="#FFFFFF" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="22" font-weight="500" >尺寸 = 跨格数 × 48 + (跨格数 − 1) × 8</text><text x="236" y="992" fill="#AABBD3" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="17" font-weight="400" >DIP 为逻辑单位；系统缩放时统一换算边界，避免独立取整导致错位。</text><text x="72" y="1050" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="15" font-weight="400" >精确矢量尺寸规范 / 原生 SVG</text><text x="1528" y="1050" fill="#52647B" font-family="Avenir Next, Arial, Hiragino Sans GB, sans-serif" font-size="15" font-weight="400" text-anchor="end">XDStarter / 2026</text></svg>